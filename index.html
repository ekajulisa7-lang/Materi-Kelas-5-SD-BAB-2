        tailwind.config = {

                    fontFamily: {

    <style>

            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #0f172a;
        }

            font-family: 'Fredoka', cursive;
        }

            transition: all 0.15s ease-in-out;

        }

        /* Custom Scrollbar */

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        /* Canvas Maze & Battle styling */
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-center items-center p-2 md:p-4 overflow-x-hidden bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900">

    <div id="app-container" class="w-full max-w-4xl min-h-[640px] md:min-h-[680px] bg-slate-100 rounded-3xl shadow-2xl border-4 border-amber-400/80 relative overflow-hidden flex flex-col justify-between">
        
        <!-- TOP HUD BAR (Always Visible except Cover) -->
        <header id="top-hud" class="hidden bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-white p-3 px-4 md:px-6 shadow-md z-30 flex justify-between items-center border-b-4 border-amber-600">
            <!-- Left: Level Info & Back Button -->
            <div class="flex items-center space-x-2 md:space-x-3">
                <button onclick="openMenuModal()" class="bg-amber-700 hover:bg-amber-800 text-white p-2 px-3 rounded-xl font-bold text-xs md:text-sm flex items-center space-x-1 border-b-2 border-amber-900 transition active:scale-95">

                <button id="btn-sound" onclick="toggleSound()" class="bg-amber-700 hover:bg-amber-800 text-white p-2 px-2.5 rounded-xl text-xs md:text-sm border-b-2 border-amber-900 transition active:scale-95" title="Mute/Unmute Suara">

        <!-- MAIN CONTENT SCREEN CONTAINER -->
        <main id="screen-container" class="flex-1 relative overflow-y-auto overflow-x-hidden flex flex-col justify-center items-center p-3 sm:p-6 bg-slate-50">

        <!-- FOOTER PROGRESS BAR -->

    <!-- GLOBAL MODALS CONTAINER -->

        <div id="modal-box" class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border-4 border-amber-400 relative animate-bounce-slow text-center max-h-[90vh] overflow-y-auto">
            <!-- Modal Body -->
        </div>
    </div>

    <script>
        // Sound System using native Web Audio API (No external sound files required)
        const SoundEngine = {
            ctx: null,
            muted: false,

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            },

            playTone(freq, type = 'sine', duration = 0.15, vol = 0.1) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    console.log('Audio play error:', e);
                }
            },

            playCorrect() {
                if (this.muted) return;
                this.playTone(523.25, 'sine', 0.1, 0.15); // C5
                setTimeout(() => this.playTone(659.25, 'sine', 0.1, 0.15), 100); // E5
                setTimeout(() => this.playTone(783.99, 'sine', 0.2, 0.2), 200); // G5
            },

            playWrong() {
                if (this.muted) return;
                this.playTone(300, 'sawtooth', 0.15, 0.15);
                setTimeout(() => this.playTone(220, 'sawtooth', 0.25, 0.2), 120);
            },

            playClick() {
                if (this.muted) return;
                this.playTone(800, 'triangle', 0.05, 0.08);
            },

            playVictory() {
                if (this.muted) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.25, 0.2), idx * 120);
                });
            },

            playSpin() {
                if (this.muted) return;
                this.playTone(600, 'sine', 0.03, 0.05);
            }
        };

        const ASMAUL_HUSNA_DATA = [

                    'Selalu memohon kekuatan hanya kepada Allah SWT.'
                ],
                icon: 'fa-dumbbell',
                color: 'from-amber-500 to-orange-600'
            },
            {
                id: 'qayyum',
                name: 'Al-Qayyum',

                meaning: 'Maha Berdiri Sendiri / Maha Menegakkan',
                desc: 'Allah mengatur dan memenuhi kebutuhan seluruh makhluk-Nya tanpa membutuhkan bantuan siapapun.',
                examples: [
                    'Menjadi pribadi yang mandiri (menyiapkan peralatan sekolah sendiri).',
                    'Selalu menyadari bahwa kita sangat membutuhkan pertolongan Allah.',
                    'Membantu sesama tanpa merugikan orang lain.'
                ],

                color: 'from-emerald-500 to-teal-700'
            },
            {
                id: 'muhyi',
                name: 'Al-Muhyi',
                arabic: 'الْمُحْيِي',
                meaning: 'Maha Menghidupkan',
                desc: 'Allah adalah satu-satunya pencipta yang memberikan kehidupan kepada seluruh manusia, hewan, dan tumbuhan.',
                examples: [
                    'Bersyukur atas nikmat sehat dan kehidupan yang diberikan Allah.',
                    'Merawat tanaman dan menyayangi hewan di sekitar kita.',
                    'Menjaga kelestarian lingkungan hidup.'
                ],
                icon: 'fa-seedling',
                color: 'from-green-500 to-emerald-600'
            },
            {
                id: 'mumit',
                name: 'Al-Mumit',
                arabic: 'الْمُمِيتُ',
                meaning: 'Maha Mematikan',
                desc: 'Allah menentukan masa hidup dan kematian setiap makhluk di alam semesta ini.',
                examples: [
                    'Mengingat bahwa kehidupan di dunia ini hanya sementara.',
                    'Memanfaatkan waktu sebaik mungkin untuk berbuat kebaikan.',
                    'Menjauhi perbuatan dosa dan maksiat.'
                ],
                icon: 'fa-hourglass-end',
                color: 'from-purple-600 to-indigo-800'
            },
            {
                id: 'baits',
                name: 'Al-Ba’its',
                arabic: 'الْبَاعِثُ',
                meaning: 'Maha Membangkitkan',
                desc: 'Allah akan membangkitkan kembali seluruh manusia dari alam kubur pada hari kebangkitan (Hari Kiamat).',
                examples: [
                    'Memperbanyak amal saleh sebagai bekal di akhirat kelak.',
                    'Percaya dan meyakini adanya hari pembalasan.',
                    'Selalu jujur dan bertanggung jawab atas semua tindakan.'
                ],
                icon: 'fa-sun',
                color: 'from-blue-500 to-cyan-600'
            }
        ];

        let gameState = {
            score: 0,
            stars: 0,
            unlockedLevel: 1,
            currentLevel: 1,
            lives: 3,
            completedLevels: [],
            assessmentCompleted: false,
            assessmentScore: 0
        };

        // Load progress from localStorage if exists
        function loadSavedState() {
            try {
                const saved = localStorage.getItem('asmaul_husna_adventure_save');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                }
            } catch(e) {
                console.log('Error loading save state');
            }
        }

        function saveState() {
            try {
                localStorage.setItem('asmaul_husna_adventure_save', JSON.stringify(gameState));
            } catch(e) {}
        }

        function updateHUD() {
            document.getElementById('hud-stars').innerText = `${gameState.stars}/10`;
            document.getElementById('hud-score').innerText = gameState.score;
            
            // Lives icons
            let hearts = '';
            for (let i = 0; i < 3; i++) {
                if (i < gameState.lives) hearts += '❤️';
                else hearts += '🖤';
            }
            document.getElementById('hud-lives-icons').innerText = hearts;

            // Level text
            if (gameState.currentLevel > 0) {
                document.getElementById('hud-level-text').innerText = `Level ${gameState.currentLevel}`;
            } else {
                document.getElementById('hud-level-text').innerText = `Peta Petualangan`;
            }

            // Progress bar
            const percent = Math.min(100, Math.round((gameState.stars / 10) * 100));
            document.getElementById('hud-progress-bar').style.width = `${percent}%`;
            document.getElementById('hud-progress-percent').innerText = `${percent}%`;
        }

        function toggleSound() {
            SoundEngine.muted = !SoundEngine.muted;
            const icon = document.getElementById('icon-sound');
            if (SoundEngine.muted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
            } else {
                icon.className = 'fa-solid fa-volume-high text-yellow-300';
                SoundEngine.playClick();
            }
        }

        function showScreen(screenHtml, hideHud = false) {
            const container = document.getElementById('screen-container');
            const hud = document.getElementById('top-hud');
            const bottomHud = document.getElementById('bottom-hud');

            if (hideHud) {
                hud.classList.add('hidden');
                bottomHud.classList.add('hidden');
            } else {
                hud.classList.remove('hidden');
                bottomHud.classList.remove('hidden');
                updateHUD();
            }

            container.innerHTML = screenHtml;
            container.scrollTop = 0;
        }

        function renderCoverScreen() {
            gameState.currentLevel = 0;
            const html = `
                <div class="flex flex-col items-center justify-center text-center p-4 md:p-8 my-auto max-w-2xl">
                    <div class="relative mb-6 animate-float">
                        <div class="w-32 h-32 md:w-44 md:h-44 bg-gradient-to-tr from-amber-400 via-orange-500 to-yellow-300 rounded-full flex items-center justify-center shadow-xl border-4 border-amber-200">
                            <i class="fa-solid fa-mosque text-5xl md:text-7xl text-white drop-shadow-md"></i>
                        </div>
                        <div class="absolute -top-2 -right-2 bg-amber-300 text-amber-900 rounded-full p-2 text-xl font-bold border-2 border-white shadow-lg">
                            ⭐ SD 5
                        </div>
                    </div>

                    <h1 class="text-3xl md:text-5xl font-extrabold font-title text-transparent bg-clip-text bg-gradient-to-r from-amber-600 via-orange-600 to-amber-700 mb-2 drop-shadow">
                        PETUALANGAN ASMAUL HUSNA
                    </h1>
                    <p class="text-slate-600 font-semibold text-sm md:text-lg mb-8 leading-relaxed">
                        "Kenali Nama-Nama Allah, Taklukkan 10 Tantangan Seru, Raih Bintang, dan Buka Kuil Asmaul Husna!"
                    </p>

                    <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                        <button onclick="SoundEngine.playClick(); renderMainMenu();" class="btn-game bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-title text-xl md:text-2xl px-8 py-4 rounded-2xl border-b-4 border-green-800 shadow-lg flex items-center justify-center space-x-3 transition active:scale-95">
                            <i class="fa-solid fa-play text-yellow-300"></i>
                            <span>MULAI PETUALANGAN</span>
                        </button>
                    </div>

                    <div class="mt-8 text-xs text-slate-400">
                        Materi: Al-Qawiyyu • Al-Qayyum • Al-Muhyi • Al-Mumit • Al-Ba’its
                    </div>
                </div>
            `;
            showScreen(html, true);
        }

        function renderMainMenu() {
            gameState.currentLevel = 0;
            const html = `
                <div class="flex flex-col items-center justify-center w-full max-w-lg p-4 my-auto">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl md:text-3xl font-title font-bold text-amber-600 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-compass text-orange-500"></i> Menu Utama
                        </h2>
                        <p class="text-xs md:text-sm text-slate-500">Pilih menu untuk memulai petualanganmu!</p>
                    </div>

                    <div class="flex flex-col gap-3.5 w-full">
                        <button onclick="SoundEngine.playClick(); renderMapScreen();" class="btn-game bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white p-4 rounded-2xl font-title text-lg md:text-xl border-b-4 border-orange-700 flex items-center justify-between px-6 shadow-md">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-map-location-dot text-2xl text-yellow-200"></i>
                                <span>Peta Petualangan (Level)</span>
                            </div>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>

                        <button onclick="SoundEngine.playClick(); renderMaterialScreen();" class="btn-game bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white p-4 rounded-2xl font-title text-lg md:text-xl border-b-4 border-indigo-800 flex items-center justify-between px-6 shadow-md">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-book-open-reader text-2xl text-blue-200"></i>
                                <span>Materi Asmaul Husna</span>
                            </div>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>

                        <button onclick="SoundEngine.playClick(); renderHowToPlayScreen();" class="btn-game bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white p-4 rounded-2xl font-title text-lg md:text-xl border-b-4 border-emerald-800 flex items-center justify-between px-6 shadow-md">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-circle-question text-2xl text-teal-200"></i>
                                <span>Cara Bermain</span>
                            </div>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>

                        <button onclick="SoundEngine.playClick(); renderAchievementsScreen();" class="btn-game bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white p-4 rounded-2xl font-title text-lg md:text-xl border-b-4 border-pink-800 flex items-center justify-between px-6 shadow-md">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-award text-2xl text-pink-200"></i>
                                <span>Prestasi & Bintang</span>
                            </div>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>

                        ${gameState.stars >= 10 ? `
                        <button onclick="SoundEngine.playClick(); renderAssessmentScreen();" class="btn-game bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 text-amber-950 p-4 rounded-2xl font-title text-lg md:text-xl border-b-4 border-amber-700 flex items-center justify-between px-6 shadow-md animate-pulse">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-graduation-cap text-2xl text-amber-900"></i>
                                <span>Asesmen Akhir (Uji Pemahaman)</span>
                            </div>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                        ` : ''}
                    </div>
                </div>
            `;
            showScreen(html, false);
        }

        function renderMapScreen() {
            gameState.currentLevel = 0;
            const levelTitles = [
                "Gerbang Lima Nama",
                "Hutan Pasangan",
                "Jembatan Makna",
                "Labirin Asmaul Husna",
                "Harta Karun Akhlak",
                "Tebak Gambar",
                "Roda Keberuntungan",
                "Kode Rahasia",
                "Pertarungan Pengetahuan",
                "Kuil Asmaul Husna"
            ];

            let nodesHtml = '';
            for (let i = 1; i <= 10; i++) {
                const isUnlocked = i <= gameState.unlockedLevel;
                const isCompleted = gameState.completedLevels.includes(i);
                
                let btnStyle = "bg-slate-300 text-slate-500 border-slate-400 cursor-not-allowed";
                let starIcon = `<i class="fa-solid fa-lock text-slate-400"></i>`;
                
                if (isUnlocked) {
                    if (isCompleted) {
                        btnStyle = "bg-gradient-to-b from-amber-400 to-orange-500 text-white border-amber-700 shadow-lg hover:scale-105";
                        starIcon = `<i class="fa-solid fa-star text-yellow-200"></i>`;
                    } else {
                        btnStyle = "bg-gradient-to-b from-emerald-400 to-green-600 text-white border-green-800 shadow-lg hover:scale-105 animate-bounce-slow";
                        starIcon = `<i class="fa-regular fa-star text-white"></i>`;
                    }
                }

                nodesHtml += `
                    <div class="flex flex-col items-center relative my-2">
                        <button ${isUnlocked ? `onclick="startLevel(${i})"` : ''} class="w-14 h-14 md:w-16 md:h-16 rounded-2xl border-b-4 flex flex-col items-center justify-center font-title text-lg font-bold transition active:scale-95 ${btnStyle}">
                            <span>${i}</span>

        function handleLevelComplete(gainedScore = 20) {

                gameState.completedLevels.push(gameState.currentLevel);
                gameState.stars++;
            }

            if (gameState.unlockedLevel === gameState.currentLevel && gameState.unlockedLevel < 10) {
                gameState.unlockedLevel++;

            saveState();

            const isFinalLevel = gameState.currentLevel === 10;

        function level1_GerbangLimaNama() {
            const questions = [
                { q: "Allah Maha Kuat dan tidak terbatas kekuatan-Nya disebut...", correct: "Al-Qawiyyu", options: ["Al-Qawiyyu", "Al-Muhyi", "Al-Ba’its", "Al-Mumit"] },

                { q: "Allah Maha Menghidupkan seluruh makhluk di alam semesta adalah...", correct: "Al-Muhyi", options: ["Al-Ba’its", "Al-Mumit", "Al-Muhyi", "Al-Qayyum"] },
                { q: "Allah Maha Mematikan yang menentukan ajal setiap makhluk adalah...", correct: "Al-Mumit", options: ["Al-Mumit", "Al-Qawiyyu", "Al-Muhyi", "Al-Ba’its"] },
                { q: "Allah Maha Membangkitkan manusia pada hari kiamat kelak adalah...", correct: "Al-Ba’its", options: ["Al-Qayyum", "Al-Ba’its", "Al-Qawiyyu", "Al-Muhyi"] }
            ];

            let curIndex = 0;

            function renderQ() {
                const qData = questions[curIndex];
                const html = `
                    <div class="w-full max-w-xl bg-white p-5 md:p-6 rounded-3xl border-4 border-amber-400 shadow-xl my-auto">
                        <div class="flex justify-between items-center mb-4 border-b pb-2">
                            <span class="text-xs font-bold bg-amber-100 text-amber-800 px-3 py-1 rounded-full">LEVEL 1: Gerbang Lima Nama</span>
                            <span class="text-xs font-bold text-slate-500">Soal ${curIndex+1}/5</span>
                        </div>

                        <div class="text-center my-6">
                            <h3 class="text-lg md:text-xl font-title font-bold text-slate-800 leading-snug">"${qData.q}"</h3>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                            ${qData.options.map(opt => `
                                <button onclick="checkL1('${opt}')" class="btn-game bg-slate-100 hover:bg-amber-500 hover:text-white text-slate-800 font-title font-bold text-base p-3.5 rounded-2xl border-2 border-slate-300 text-center transition">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
                showScreen(html, false);
            }

            window.checkL1 = function(selected) {
                if (selected === questions[curIndex].correct) {
                    SoundEngine.playCorrect();
                    curIndex++;
                    if (curIndex >= questions.length) {
                        handleLevelComplete(20);
                    } else {
                        renderQ();
                    }
                } else {
                    handleWrongAnswer("Pilihan kurang tepat! Ingat kembali arti dari masing-masing Asmaul Husna.");
                }
            };

            renderQ();
        }

        function level2_HutanPasangan() {
            const pairs = [
                { id: 1, text: "Al-Qawiyyu", matchId: 101 },
                { id: 101, text: "Maha Kuat", matchId: 1 },
                { id: 2, text: "Al-Qayyum", matchId: 102 },
                { id: 102, text: "Maha Berdiri Sendiri", matchId: 2 },
                { id: 3, text: "Al-Muhyi", matchId: 103 },
                { id: 103, text: "Maha Menghidupkan", matchId: 3 },
                { id: 4, text: "Al-Mumit", matchId: 104 },
                { id: 104, text: "Maha Mematikan", matchId: 4 },
                { id: 5, text: "Al-Ba’its", matchId: 105 },
                { id: 105, text: "Maha Membangkitkan", matchId: 5 },
            ];

            // Shuffle
            const cards = [...pairs].sort(() => Math.random() - 0.5);

            let selectedCards = [];
            let matchedPairs = [];

            function renderCards() {
                const gridHtml = cards.map((c, idx) => {
                    const isMatched = matchedPairs.includes(c.id);
                    const isSelected = selectedCards.some(sc => sc.idx === idx);

                    let cardClass = "bg-amber-100 border-amber-300 text-amber-900";
                    if (isMatched) cardClass = "bg-green-500 border-green-700 text-white opacity-60 cursor-default";
                    else if (isSelected) cardClass = "bg-blue-500 border-blue-700 text-white scale-105";

                    return `
                        <button ${isMatched ? '' : `onclick="clickL2Card(${idx})"`} class="h-20 sm:h-24 p-2 rounded-2xl border-b-4 font-title font-bold text-xs sm:text-sm flex items-center justify-center text-center shadow-md transition ${cardClass}">
                            ${c.text}
                        </button>
                    `;
                }).join('');

                const html = `
                    <div class="w-full max-w-2xl bg-white p-4 sm:p-6 rounded-3xl border-4 border-emerald-400 shadow-xl my-auto">
                        <div class="flex justify-between items-center mb-4 border-b pb-2">
                            <span class="text-xs font-bold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">LEVEL 2: Hutan Pasangan</span>
                            <span class="text-xs font-bold text-slate-500">Pasangkan Asmaul Husna & Artinya (${matchedPairs.length / 2}/5)</span>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mb-2">
                            ${gridHtml}
                        </div>
                    </div>
                `;
                showScreen(html, false);
            }

            window.clickL2Card = function(idx) {
                if (selectedCards.length === 1 && selectedCards[0].idx === idx) return;

                SoundEngine.playClick();
                selectedCards.push({ idx, card: cards[idx] });
                renderCards();

                if (selectedCards.length === 2) {
                    const [c1, c2] = selectedCards;
                    if (c1.card.matchId === c2.card.id) {
                        // Match!
                        SoundEngine.playCorrect();
                        matchedPairs.push(c1.card.id, c2.card.id);
                        selectedCards = [];
                        setTimeout(() => {
                            if (matchedPairs.length === cards.length) {
                                handleLevelComplete(20);
                            } else {
                                renderCards();
                            }
                        }, 300);
                    } else {
                        // Fail match
                        setTimeout(() => {
                            handleWrongAnswer("Pasangan kartu belum cocok, coba lagi!");
                            selectedCards = [];
                            renderCards();
                        }, 500);
                    }
                }
            };

            renderCards();
        }

        function level3_JembatanMakna() {
            const scenarios = [
                {
                    story: "Rani selalu bersyukur karena Allah memberikan kehidupan, nafas, dan kesehatan kepada seluruh manusia dan tanaman. Asmaul Husna yang sesuai adalah...",

                {

                    correct: "Al-Qayyum",
                    options: ["Al-Ba’its", "Al-Qayyum", "Al-Mumit", "Al-Qawiyyu"]

                {

                    correct: "Al-Qawiyyu",
                    options: ["Al-Qawiyyu", "Al-Muhyi", "Al-Ba’its", "Al-Qayyum"]
                }
            ];

            let curStep = 0;

            function renderBridge() {
                const s = scenarios[curStep];
                const html = `
                    <div class="w-full max-w-xl bg-white p-5 md:p-6 rounded-3xl border-4 border-blue-400 shadow-xl my-auto text-center">
                        <div class="flex justify-between items-center mb-3 border-b pb-2">

                        </div>

                        <!-- Mini Character Avatar -->
                        <div class="text-4xl my-2 animate-bounce-slow">🏃‍♂️ Bridge Adventure</div>

                        <div class="bg-blue-50 p-4 rounded-2xl border border-blue-200 my-4 text-xs md:text-sm text-slate-700 font-semibold leading-relaxed">

        function level4_LabirinAsmaulHusna() {
            // Interactive 5x5 Maze grid logic
            let playerPos = { r: 0, c: 0 };
            const exitPos = { r: 4, c: 4 };

            // Grid obstacles & question nodes
            const questionNodes = [
                { r: 2, c: 1, q: "Sifat Allah Maha Mematikan adalah...", correct: "Al-Mumit", options: ["Al-Mumit", "Al-Muhyi"], solved: false },
                { r: 3, c: 3, q: "Sifat Allah Maha Membangkitkan adalah...", correct: "Al-Ba’its", options: ["Al-Ba’its", "Al-Qawiyyu"], solved: false }
            ];

            function renderMaze() {
                let gridHtml = '';
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const isPlayer = playerPos.r === r && playerPos.c === c;
                        const isExit = exitPos.r === r && exitPos.c === c;
                        const qNode = questionNodes.find(q => q.r === r && q.c === c);

                        let cellContent = '';
                        let cellBg = 'bg-slate-100 border-slate-300';

                        if (isPlayer) {
                            cellContent = '🏃';
                            cellBg = 'bg-amber-300 border-amber-500 font-bold';
                        } else if (isExit) {
                            cellContent = '🏛️';
                            cellBg = 'bg-green-300 border-green-500';
                        } else if (qNode && !qNode.solved) {
                            cellContent = '❓';
                            cellBg = 'bg-purple-200 border-purple-400';
                        }

                        gridHtml += `
                            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl border-2 flex items-center justify-center text-xl shadow-inner ${cellBg}">
                                ${cellContent}
                            </div>
                        `;
                    }
                }

                const html = `
                    <div class="w-full max-w-lg bg-white p-4 sm:p-6 rounded-3xl border-4 border-indigo-400 shadow-xl my-auto text-center flex flex-col items-center">
                        <div class="flex justify-between items-center w-full mb-3 border-b pb-2">
                            <span class="text-xs font-bold bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">LEVEL 4: Labirin Asmaul Husna</span>
                            <span class="text-xs font-bold text-slate-500">Navigasi ke Gerbang 🏛️</span>
                        </div>

                        <div class="grid grid-cols-5 gap-2 my-2 bg-slate-200 p-3 rounded-2xl border-2 border-slate-300">
                            ${gridHtml}
                        </div>

                        <!-- Touch Navigation Buttons -->
                        <div class="mt-3 grid grid-cols-3 gap-2 w-48">
                            <div></div>
                            <button onclick="moveMaze('up')" class="btn-game bg-indigo-600 text-white py-2 rounded-xl text-lg"><i class="fa-solid fa-arrow-up"></i></button>
                            <div></div>
                            <button onclick="moveMaze('left')" class="btn-game bg-indigo-600 text-white py-2 rounded-xl text-lg"><i class="fa-solid fa-arrow-left"></i></button>
                            <button onclick="moveMaze('down')" class="btn-game bg-indigo-600 text-white py-2 rounded-xl text-lg"><i class="fa-solid fa-arrow-down"></i></button>
                            <button onclick="moveMaze('right')" class="btn-game bg-indigo-600 text-white py-2 rounded-xl text-lg"><i class="fa-solid fa-arrow-right"></i></button>
                        </div>
                    </div>
                `;
                showScreen(html, false);
            }

            window.moveMaze = function(dir) {
                let nr = playerPos.r;
                let nc = playerPos.c;

                if (dir === 'up') nr--;
                if (dir === 'down') nr++;
                if (dir === 'left') nc--;
                if (dir === 'right') nc++;

                if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
                    playerPos = { r: nr, c: nc };
                    SoundEngine.playClick();

                    // Check Question Node
                    const qNode = questionNodes.find(q => q.r === nr && q.c === nc);
                    if (qNode && !qNode.solved) {
                        askMazeQuestion(qNode);
                        return;
                    }

                    // Check Exit
                    if (nr === exitPos.r && nc === exitPos.c) {
                        handleLevelComplete(20);
                        return;
                    }

                    renderMaze();
                }
            };

            function askMazeQuestion(qNode) {
                const modalBox = document.getElementById('modal-box');
                modalBox.innerHTML = `
                    <h3 class="text-lg font-title font-bold text-slate-800 mb-2">Tantangan Labirin! ❓</h3>
                    <p class="text-xs text-slate-600 mb-4 font-semibold">${qNode.q}</p>
                    <div class="flex justify-center space-x-3">
                        ${qNode.options.map(opt => `
                            <button onclick="answerMazeQ('${opt}', '${qNode.correct}')" class="bg-indigo-600 text-white font-bold text-sm px-4 py-2.5 rounded-xl border-b-2 border-indigo-800">${opt}</button>
                        `).join('')}
                    </div>
                `;
                document.getElementById('modal-container').classList.remove('hidden');

                window.answerMazeQ = function(answer, correct) {
                    closeModal();
                    if (answer === correct) {
                        SoundEngine.playCorrect();
                        qNode.solved = true;
                        renderMaze();
                    } else {
                        // Move back
                        playerPos = { r: 0, c: 0 };
                        handleWrongAnswer("Jawaban labirin salah! Karakter kembali ke titik awal.");
                        renderMaze();
                    }
                };
            }

            renderMaze();
        }

                { q: "5. Allah akan membangkitkan manusia dari alam kubur pada hari pembalasan, yaitu sifat...", options: ["Al-Qawiyyu", "Al-Muhyi", "Al-Ba’its", "Al-Qayyum"], correct: 2 },
                { q: "6. Doni tidak mudah putus asa saat menghadapi ujian sekolah. Doni meneladani sifat...", options: ["Al-Qawiyyu", "Al-Mumit", "Al-Ba’its", "Al-Qayyum"], correct: 0 },
                { q: "7. Sikap menyayangi tanaman dan hewan sekitar merupakan bukti rasa syukur atas sifat...", options: ["Al-Muhyi", "Al-Mumit", "Al-Qayyum", "Al-Ba’its"], correct: 0 },
                { q: "8. Perbedaan makna Al-Muhyi dan Al-Mumit adalah...", options: ["Al-Muhyi Maha Kuat, Al-Mumit Maha Menghidupkan", "Al-Muhyi Maha Menghidupkan, Al-Mumit Maha Mematikan", "Al-Muhyi Maha Membangkitkan, Al-Mumit Maha Berdiri Sendiri", "Tidak ada perbedaan"], correct: 1 },
                { q: "9. Memperbanyak bekal amal saleh untuk akhirat adalah bentuk keimanan terhadap...", options: ["Al-Ba’its", "Al-Qawiyyu", "Al-Muhyi", "Al-Qayyum"], correct: 0 },
                { q: "10. Sifat Allah yang menegakkan dan tidak memerlukan bantuan siapapun adalah...", options: ["Al-Qayyum", "Al-Mumit", "Al-Muhyi", "Al-Ba’its"], correct: 0 }
            ];

            let userAnswers = new Array(10).fill(null);

            function renderQuizPaper() {
                const itemsHtml = assessmentQuestions.map((item, idx) => `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-left mb-4">
                        <div class="font-title font-bold text-slate-800 text-sm md:text-base mb-3">${item.q}</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${item.options.map((opt, optIdx) => {
                                const isSelected = userAnswers[idx] === optIdx;
                                return `
                                    <button onclick="selectAssessmentAns(${idx}, ${optIdx})" class="p-2.5 rounded-xl border text-xs md:text-sm font-semibold text-left transition ${isSelected ? 'bg-amber-500 text-white border-amber-700 font-bold' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-300'}">
                                        ${String.fromCharCode(65 + optIdx)}. ${opt}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `).join('');

                const html = `
                    <div class="w-full max-w-2xl flex flex-col my-auto p-2">
                        <div class="bg-white p-4 rounded-3xl border-4 border-amber-400 shadow-xl mb-4 text-center">
                            <h2 class="text-2xl font-title font-bold text-amber-600">🎓 UJI PEMAHAMANMU!</h2>
                            <p class="text-xs text-slate-500">Jawab 10 soal di bawah ini untuk menguji pengetahuan Asmaul Husna.</p>
                        </div>

                        <div class="max-h-[460px] overflow-y-auto pr-1">
                            ${itemsHtml}
                        </div>

                        <div class="mt-4 text-center">
                            <button onclick="submitAssessment()" class="btn-game bg-gradient-to-r from-emerald-500 to-green-600 text-white font-title text-xl px-10 py-3.5 rounded-2xl border-b-4 border-green-800 shadow-lg">
                                KIRIM JAWABAN
                            </button>
                        </div>
                    </div>
                `;
                showScreen(html, false);
            }

            window.selectAssessmentAns = function(qIdx, optIdx) {
                SoundEngine.playClick();
                userAnswers[qIdx] = optIdx;
                renderQuizPaper();
            };

            window.submitAssessment = function() {
                if (userAnswers.includes(null)) {
                    const modalBox = document.getElementById('modal-box');
                    modalBox.innerHTML = `
                        <h3 class="text-lg font-title font-bold text-red-600 mb-2">Soal Belum Lengkap!</h3>
                        <p class="text-xs text-slate-600 mb-4">Harap jawab semua 10 pertanyaan terlebih dahulu sebelum mengirim jawaban.</p>
                        <button onclick="closeModal()" class="bg-red-500 text-white font-bold px-6 py-2 rounded-xl">Mengerti</button>
                    `;
                    document.getElementById('modal-container').classList.remove('hidden');
                    return;
                }

                // Calculate Score
                let correctCount = 0;
                assessmentQuestions.forEach((q, idx) => {
                    if (userAnswers[idx] === q.correct) correctCount++;
                });

                const finalScore = correctCount * 10;
                gameState.assessmentCompleted = true;
                gameState.assessmentScore = finalScore;
                saveState();

                renderAssessmentResults(finalScore, correctCount);
            };

            renderQuizPaper();
        }

        function renderAssessmentResults(score, correctCount) {
            let feedbackCategory = "";
            let badgeIcon = "";

            if (score >= 90) {
                feedbackCategory = "Luar Biasa! Pemahamanmu sangat baik!";
                badgeIcon = "🏆 Medali Emas";
            } else if (score >= 80) {
                feedbackCategory = "Hebat! Kamu sudah memahami materi dengan baik!";
                badgeIcon = "🥇 Medali Perak";
            } else if (score >= 70) {
                feedbackCategory = "Bagus! Terus berlatih agar semakin memahami materi.";
                badgeIcon = "🥉 Medali Perunggu";
            } else {
                feedbackCategory = "Tetap semangat! Yuk, pelajari kembali materi dan coba lagi.";
                badgeIcon = "🎗️ Lencana Peserta";
            }

            const html = `
                <div class="w-full max-w-xl bg-white p-6 rounded-3xl border-4 border-amber-400 shadow-2xl my-auto text-center">
                    <div class="text-5xl text-yellow-400 mb-2 animate-bounce">🎖️</div>
                    <h2 class="text-2xl font-title font-bold text-amber-600 mb-1">HASIL ASESMEN AKHIR</h2>
                    <p class="text-xs text-slate-500 mb-4">Petualangan Mengenal Asmaul Husna</p>

                    <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 mb-6">
                        <div class="text-4xl font-title font-bold text-amber-700 mb-1">${score} / 100</div>
                        <div class="text-xs font-bold text-slate-600 mb-2">Jawaban Benar: ${correctCount} dari 10 Soal</div>
                        <div class="text-sm font-title font-bold text-emerald-600">${feedbackCategory}</div>
                        <div class="mt-2 inline-block bg-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-full">${badgeIcon}</div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3 justify-center">
                        <button onclick="SoundEngine.playClick(); renderAssessmentScreen();" class="btn-game bg-amber-500 hover:bg-amber-600 text-white font-title text-base py-3 px-6 rounded-xl border-b-4 border-amber-700">
                            🔄 Coba Lagi
                        </button>
                        <button onclick="SoundEngine.playClick(); renderMaterialScreen();" class="btn-game bg-blue-600 hover:bg-blue-700 text-white font-title text-base py-3 px-6 rounded-xl border-b-4 border-blue-800">
                            📖 Pelajari Materi Kembali
                        </button>
                    </div>
                </div>
            `;
            showScreen(html, false);
        }

        window.onload = function() {
            loadSavedState();
            renderCoverScreen();
        };
    </script>
</body>
</html>
